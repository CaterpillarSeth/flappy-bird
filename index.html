<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #70c5ce;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: 'Segoe UI', sans-serif;
        }
        #gameCanvas {
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 100vw;
            max-height: 100vh;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #startScreen, #gameOverScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: all;
        }
        #startScreen.active, #gameOverScreen.active {
            display: flex;
        }
        .title {
            font-size: 3rem;
            color: #fff;
            text-shadow: 3px 3px 0 #543847;
            margin-bottom: 20px;
        }
        .tap-hint {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 2px 2px 0 #543847;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .game-over-title {
            font-size: 2.5rem;
            color: #f3c43e;
            text-shadow: 3px 3px 0 #543847;
            margin-bottom: 10px;
        }
        .score-display {
            font-size: 2rem;
            color: #fff;
            text-shadow: 2px 2px 0 #543847;
            margin: 10px 0;
        }
        .restart-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.3rem;
            background: #f3c43e;
            border: 3px solid #543847;
            border-radius: 10px;
            cursor: pointer;
            color: #543847;
            font-weight: bold;
            box-shadow: 0 4px 0 #543847;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #543847;
        }
        .medal {
            font-size: 3rem;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
        <div id="startScreen">
            <div class="title">Flappy Bird</div>
            <div class="tap-hint">Tap to Start!</div>
        </div>
        <div id="gameOverScreen">
            <div class="game-over-title">Game Over!</div>
            <div class="score-display">Score: <span id="finalScore">0</span></div>
            <div class="score-display">Best: <span id="bestScore">0</span></div>
            <div class="medal" id="medal"></div>
            <button class="restart-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            const maxW = Math.min(window.innerWidth, 400);
            const maxH = Math.min(window.innerHeight, 600);
            const ratio = 288 / 512;
            if (maxW / maxH < ratio) {
                canvas.width = maxW;
                canvas.height = maxW / ratio;
            } else {
                canvas.height = maxH;
                canvas.width = maxH * ratio;
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        let gameState = 'start'; // start, playing, over
        let score = 0;
        let best = parseInt(localStorage.getItem('flappyBest') || '0');

        // Bird
        const bird = {
            x: 0, y: 0, w: 34, h: 24,
            velocity: 0, gravity: 0.5, jump: -8,
            rotation: 0,
            flap() { this.velocity = this.jump; }
        };

        // Pipes
        let pipes = [];
        const pipeW = 52;
        const pipeGap = 130;
        let pipeSpeed = 2.5;
        let pipeTimer = 0;
        let pipeInterval = 100;

        // Power-ups
        let powerUps = [];
        const POWERUP_TYPES = {
            GHOST: { type: 'ghost', color: '#9b59b6', icon: '👻', duration: 5000 },
            SLOWMO: { type: 'slowmo', color: '#3498db', icon: '⏱️', duration: 5000 },
            TINY: { type: 'tiny', color: '#2ecc71', icon: '🔽', duration: 5000 }
        };
        let activePowerUp = null;
        let powerUpTimer = 0;
        let powerUpSpawnChance = 0.25; // 25% chance per pipe

        // Ground
        let groundX = 0;
        let groundSpeed = 2;

        // Cloud
        let clouds = [];
        for (let i = 0; i < 4; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height * 0.4,
                w: 60 + Math.random() * 40,
                speed: 0.3 + Math.random() * 0.3
            });
        }

        // Base game speed (for slow motion effect)
        let basePipeSpeed = 2.5;
        let baseGravity = 0.5;

        function initGame() {
            bird.x = canvas.width * 0.25;
            bird.y = canvas.height * 0.5;
            bird.velocity = 0;
            bird.rotation = 0;
            bird.w = 34;
            bird.h = 24;
            pipes = [];
            powerUps = [];
            score = 0;
            pipeTimer = 0;
            groundX = 0;
            activePowerUp = null;
            powerUpTimer = 0;
            pipeSpeed = basePipeSpeed;
            bird.gravity = baseGravity;
        }

        function startGame() {
            gameState = 'playing';
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('gameOverScreen').classList.remove('active');
            initGame();
        }

        function gameOver() {
            gameState = 'over';
            if (score > best) {
                best = score;
                localStorage.setItem('flappyBest', best);
            }
            document.getElementById('finalScore').textContent = score;
            document.getElementById('bestScore').textContent = best;
            
            let medal = '';
            if (score >= 40) medal = '🏆';
            else if (score >= 30) medal = '🥇';
            else if (score >= 20) medal = '🥈';
            else if (score >= 10) medal = '🥉';
            document.getElementById('medal').textContent = medal;
            
            document.getElementById('gameOverScreen').classList.add('active');
        }

        function restartGame() {
            startGame();
        }

        // Input
        function handleInput(e) {
            e.preventDefault();
            if (gameState === 'start') {
                startGame();
            } else if (gameState === 'playing') {
                bird.flap();
            }
        }

        canvas.addEventListener('touchstart', handleInput);
        canvas.addEventListener('mousedown', handleInput);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handleInput(e);
        });

        function spawnPipe() {
            const minY = 80;
            const maxY = canvas.height - groundH - pipeGap - 80;
            const gapY = minY + Math.random() * (maxY - minY);
            pipes.push({
                x: canvas.width,
                gapY: gapY,
                scored: false
            });

            // Chance to spawn power-up with this pipe
            if (Math.random() < powerUpSpawnChance && activePowerUp === null) {
                spawnPowerUp(gapY);
            }
        }

        function spawnPowerUp(gapY) {
            const types = Object.keys(POWERUP_TYPES);
            const randomType = types[Math.floor(Math.random() * types.length)];
            const powerUpType = POWERUP_TYPES[randomType];
            
            // Position in the gap - either high or low
            const gapCenter = gapY + pipeGap / 2;
            const offset = (pipeGap / 2 - 25) * (Math.random() > 0.5 ? 0.7 : -0.7);
            
            powerUps.push({
                x: canvas.width + pipeW / 2,
                y: gapCenter + offset,
                w: 24,
                h: 24,
                type: powerUpType,
                collected: false
            });
        }

        function collectPowerUp(powerUp) {
            powerUp.collected = true;
            activePowerUp = powerUp.type;
            powerUpTimer = powerUp.type.duration;
            
            // Apply power-up effects
            applyPowerUpEffect(powerUp.type);
            
            // Play sound effect (optional - using AudioContext for a simple beep)
            playPowerUpSound();
        }

        function applyPowerUpEffect(type) {
            switch(type.type) {
                case 'slowmo':
                    pipeSpeed = basePipeSpeed * 0.5;
                    bird.gravity = baseGravity * 0.5;
                    break;
                case 'tiny':
                    bird.w = 17;
                    bird.h = 12;
                    break;
                case 'ghost':
                    // Ghost effect handled in collision detection
                    break;
            }
        }

        function removePowerUpEffect() {
            if (!activePowerUp) return;
            
            switch(activePowerUp.type) {
                case 'slowmo':
                    pipeSpeed = basePipeSpeed;
                    bird.gravity = baseGravity;
                    break;
                case 'tiny':
                    bird.w = 34;
                    bird.h = 24;
                    break;
                case 'ghost':
                    // Nothing to reset
                    break;
            }
            activePowerUp = null;
        }

        function playPowerUpSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.2);
            } catch(e) {
                // Audio not supported, ignore
            }
        }

        const groundH = 60;

        function draw() {
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#70c5ce');
            skyGrad.addColorStop(1, '#87ceeb');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Slow motion tint effect
            if (activePowerUp && activePowerUp.type === 'slowmo') {
                ctx.fillStyle = 'rgba(52, 152, 219, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Clouds
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.w * 0.3, 0, Math.PI * 2);
                ctx.arc(c.x + c.w * 0.25, c.y - c.w * 0.1, c.w * 0.25, 0, Math.PI * 2);
                ctx.arc(c.x + c.w * 0.5, c.y, c.w * 0.3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Pipes
            pipes.forEach(p => {
                const ph = canvas.height - groundH;
                
                // Top pipe
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(p.x, 0, pipeW, p.gapY);
                ctx.fillStyle = '#5da326';
                ctx.fillRect(p.x + 4, 0, 10, p.gapY);
                // Top pipe cap
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(p.x - 3, p.gapY - 26, pipeW + 6, 26);
                ctx.fillStyle = '#5da326';
                ctx.fillRect(p.x, p.gapY - 22, 8, 18);

                // Bottom pipe
                const bottomY = p.gapY + pipeGap;
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(p.x, bottomY, pipeW, ph - bottomY);
                ctx.fillStyle = '#5da326';
                ctx.fillRect(p.x + 4, bottomY, 10, ph - bottomY);
                // Bottom pipe cap
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(p.x - 3, bottomY - 4, pipeW + 6, 26);
                ctx.fillStyle = '#5da326';
                ctx.fillRect(p.x, bottomY, 8, 18);
            });

            // Power-ups
            powerUps.forEach(p => {
                if (p.collected) return;
                
                // Glow effect
                ctx.shadowColor = p.type.color;
                ctx.shadowBlur = 10;
                
                // Power-up background
                ctx.fillStyle = p.type.color;
                ctx.beginPath();
                ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI * 2);
                ctx.fill();
                
                // Border
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Icon
                ctx.shadowBlur = 0;
                ctx.font = '14px Segoe UI';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.type.icon, p.x + p.w/2, p.y + p.h/2);
            });
            ctx.shadowBlur = 0;

            // Ground
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - groundH, canvas.width, groundH);
            ctx.fillStyle = '#73bf2e';
            ctx.fillRect(0, canvas.height - groundH, canvas.width, 20);
            // Ground stripes
            ctx.fillStyle = '#c9c478';
            for (let i = 0; i < 15; i++) {
                ctx.fillRect(groundX + i * 40 - 20, canvas.height - groundH + 20, 20, groundH - 20);
            }

            // Bird
            ctx.save();
            ctx.translate(bird.x + bird.w / 2, bird.y + bird.h / 2);
            ctx.rotate(bird.rotation);
            
            // Ghost effect - semi-transparent
            if (activePowerUp && activePowerUp.type === 'ghost') {
                ctx.globalAlpha = 0.5;
            }
            
            // Body
            ctx.fillStyle = '#f7dc6f';
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.w / 2, bird.h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Wing
            ctx.fillStyle = '#e4b95b';
            ctx.beginPath();
            ctx.ellipse(-4 * (bird.w/34), 4 * (bird.h/24), 10 * (bird.w/34), 6 * (bird.h/24), -0.3, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(8 * (bird.w/34), -4 * (bird.h/24), 6 * (bird.w/34), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(9 * (bird.w/34), -4 * (bird.h/24), 3 * (bird.w/34), 0, Math.PI * 2);
            ctx.fill();
            
            // Beak
            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.moveTo(14 * (bird.w/34), 2 * (bird.h/24));
            ctx.lineTo(24 * (bird.w/34), 4 * (bird.h/24));
            ctx.lineTo(14 * (bird.w/34), 8 * (bird.h/24));
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();

            // Score
            if (gameState === 'playing') {
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = '#543847';
                ctx.lineWidth = 4;
                ctx.font = 'bold 40px Segoe UI';
                ctx.textAlign = 'center';
                ctx.strokeText(score, canvas.width / 2, 60);
                ctx.fillText(score, canvas.width / 2, 60);
            }

            // Active power-up indicator
            if (activePowerUp && gameState === 'playing') {
                const remainingTime = Math.ceil(powerUpTimer / 1000);
                
                // Background bar
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(canvas.width / 2 - 50, 70, 100, 30);
                
                // Progress bar
                const progress = powerUpTimer / activePowerUp.duration;
                ctx.fillStyle = activePowerUp.color;
                ctx.fillRect(canvas.width / 2 - 48, 72, 96 * progress, 26);
                
                // Icon and timer
                ctx.font = 'bold 16px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fff';
                ctx.fillText(`${activePowerUp.icon} ${remainingTime}s`, canvas.width / 2, 90);
            }
        }

        function update() {
            if (gameState !== 'playing') return;

            // Update power-up timer
            if (activePowerUp) {
                powerUpTimer -= 16; // ~60fps
                if (powerUpTimer <= 0) {
                    removePowerUpEffect();
                }
            }

            // Bird physics
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            bird.rotation = Math.min(Math.max(bird.velocity * 0.05, -0.5), 1.2);

            // Ground collision (always kills, even with ghost)
            if (bird.y + bird.h > canvas.height - groundH) {
                bird.y = canvas.height - groundH - bird.h;
                bird.velocity = 0;
                gameOver();
                return;
            }
            // Ceiling
            if (bird.y < 0) {
                bird.y = 0;
                bird.velocity = 0;
            }

            // Pipes
            pipeTimer++;
            if (pipeTimer >= pipeInterval) {
                pipeTimer = 0;
                spawnPipe();
            }

            pipes.forEach(p => {
                p.x -= pipeSpeed;

                // Collision (skip if ghost power-up active)
                if (!activePowerUp || activePowerUp.type !== 'ghost') {
                    const bx = bird.x, by = bird.y, bw = bird.w, bh = bird.h;
                    const px = p.x, pw = pipeW;
                    const topH = p.gapY, bottomY = p.gapY + pipeGap;

                    if (bx + bw > px && bx < px + pw) {
                        if (by < topH || by + bh > bottomY) {
                            gameOver();
                        }
                    }
                }

                // Score
                if (!p.scored && p.x + pw < bird.x) {
                    p.scored = true;
                    score++;
                }
            });

            // Remove off-screen pipes
            pipes = pipes.filter(p => p.x > -pipeW);

            // Power-ups
            powerUps.forEach(p => {
                p.x -= pipeSpeed;

                // Collision with bird
                if (!p.collected) {
                    const dx = (bird.x + bird.w/2) - (p.x + p.w/2);
                    const dy = (bird.y + bird.h/2) - (p.y + p.h/2);
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    
                    if (distance < (bird.w/2 + p.w/2)) {
                        collectPowerUp(p);
                    }
                }
            });

            // Remove off-screen or collected power-ups
            powerUps = powerUps.filter(p => p.x > -p.w && !p.collected);

            // Ground scroll
            groundX -= groundSpeed;
            if (groundX < -40) groundX = 0;

            // Clouds
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x < -c.w) {
                    c.x = canvas.width + c.w;
                    c.y = Math.random() * canvas.height * 0.4;
                }
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start
        document.getElementById('startScreen').classList.add('active');
        initGame();
        gameLoop();
    </script>
</body>
</html>
